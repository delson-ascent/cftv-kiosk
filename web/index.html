<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CFTV Kiosk</title>

<script src="hls.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

.controls {
  position: fixed;
  top: 15px;
  left: 15px;
  z-index: 100;

  display: flex;
  gap: 10px;

  padding: 10px;
  border-radius: 10px;

  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
}

button {
  padding: 12px 18px;
  border: none;
  border-radius: 8px;

  background: #333;
  color: white;

  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  background: #555;
}

.container {
  display: flex;
  width: 100vw;
  height: 100vh;
}

.video-container {
  flex: 1;
  display: none;
  background: black;
}

.video-container video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
</style>
</head>
<body>

<div class="controls">

  <button onclick="showCam(1)">
    <span id="cam1Name">Câmera 1</span>
  </button>

  <button onclick="showCam(2)">
    <span id="cam2Name">Câmera 2</span>
  </button>

  <button onclick="showCam(0)">
    Split
  </button>

  <button onclick="openRecordings()">
    Gravações
  </button>

</div>

<div class="container">

  <div id="cam1" class="video-container">
    <video
      id="video1"
      autoplay
      muted
      playsinline>
    </video>
  </div>

  <div id="cam2" class="video-container">
    <video
      id="video2"
      autoplay
      muted
      playsinline>
    </video>
  </div>

</div>

<script>  
function loadStream(videoElement, url) {

  if (Hls.isSupported()) {

    const hls = new Hls();

    hls.loadSource(url);
    hls.attachMedia(videoElement);

  }
  else if (
    videoElement.canPlayType(
      "application/vnd.apple.mpegurl"
    )
  ) {

    videoElement.src = url;

  }
  else {

    console.error(
      "HLS não suportado neste navegador."
    );

  }
}

function showCam(mode) {

  const cam1 =
    document.getElementById("cam1");

  const cam2 =
    document.getElementById("cam2");

  switch (mode) {

    case 1:

      cam1.style.display = "block";
      cam2.style.display = "none";

      break;

    case 2:

      cam1.style.display = "none";
      cam2.style.display = "block";

      break;

    default:

      cam1.style.display = "block";
      cam2.style.display = "block";

      break;
  }
}

function openRecordings() {

  window.location.href =
    "/recordings.html";

}

async function init() {

  try {

    const config =
      await fetch("/api/config")
        .then(r => r.json());

    if (config.cameras[0]) {

      document.getElementById("cam1Name")
        .textContent =
        config.cameras[0].name;

      loadStream(
        document.getElementById("video1"),
        config.cameras[0].streamUrl
      );

    }

    if (config.cameras[1]) {

      document.getElementById("cam2Name")
        .textContent =
        config.cameras[1].name;

      loadStream(
        document.getElementById("video2"),
        config.cameras[1].streamUrl
      );

    }

    showCam(0);

  }
  catch (error) {

    console.error(
      "Erro ao carregar configuração:",
      error
    );

  }

}

init();

</script>

</body>
</html>
