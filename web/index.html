<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CFTV Kiosk</title>

<script src="hls.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

.controls {
  position: fixed;
  top: 15px;
  left: 15px;
  z-index: 100;

  display: flex;
  gap: 10px;

  padding: 10px;
  border-radius: 10px;

  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
}

button {
  padding: 12px 18px;
  border: none;
  border-radius: 8px;

  background: #333;
  color: white;

  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  background: #555;
}

.container {
  display: flex;
  width: 100vw;
  height: 100vh;
}

.video-container {
  flex: 1;
  display: none;
  background: black;
}

.video-container video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
</style>
</head>
<body>

<div class="controls">

  <button onclick="showCam(1)">
    Câmera 1
  </button>

  <button onclick="showCam(2)">
    Câmera 2
  </button>

  <button onclick="showCam(0)">
    Split
  </button>

  <button onclick="openRecordings()">
    Gravações
  </button>

</div>

<div class="container">

  <div id="cam1" class="video-container">
    <video
      id="video1"
      autoplay
      muted
      playsinline>
    </video>
  </div>

  <div id="cam2" class="video-container">
    <video
      id="video2"
      autoplay
      muted
      playsinline>
    </video>
  </div>

</div>

<script>

const STREAMS = {
  camera1: "http://localhost:8888/camera1/index.m3u8",
  camera2: "http://localhost:8888/camera2/index.m3u8"
};

function loadStream(videoElement, url) {

  if (Hls.isSupported()) {

    const hls = new Hls();

    hls.loadSource(url);
    hls.attachMedia(videoElement);

  }
  else if (
    videoElement.canPlayType(
      "application/vnd.apple.mpegurl"
    )
  ) {

    videoElement.src = url;

  }
  else {

    console.error(
      "HLS não suportado neste navegador."
    );

  }
}

function showCam(mode) {

  const cam1 =
    document.getElementById("cam1");

  const cam2 =
    document.getElementById("cam2");

  switch (mode) {

    case 1:

      cam1.style.display = "block";
      cam2.style.display = "none";

      break;

    case 2:

      cam1.style.display = "none";
      cam2.style.display = "block";

      break;

    default:

      cam1.style.display = "block";
      cam2.style.display = "block";

      break;
  }
}

function openRecordings() {

  window.location.href =
    "/recordings.html";

}

loadStream(
  document.getElementById("video1"),
  STREAMS.camera1
);

loadStream(
  document.getElementById("video2"),
  STREAMS.camera2
);

showCam(0);

</script>

</body>
</html>
